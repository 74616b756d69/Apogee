<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apogee — 発表用</title>
    <style>
      :root {
        /* iPhone 15 Pro の論理解像度。ここを変えると端末サイズが変わる。 */
        --screen-w: 393px;
        --screen-h: 852px;
        --bezel: 12px;
        --radius: 56px;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        background: #05070c;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", sans-serif;
      }

      /* 投影時に中央へ置く。scale は JS がウインドウ高さに合わせて決める。 */
      .stage {
        display: grid;
        place-items: center;
        height: 100%;
        width: 100%;
      }

      .phone {
        position: relative;
        width: calc(var(--screen-w) + var(--bezel) * 2);
        height: calc(var(--screen-h) + var(--bezel) * 2);
        padding: var(--bezel);
        border-radius: var(--radius);
        background: linear-gradient(160deg, #3a3f47 0%, #12151a 22%, #0d1014 78%, #2b3037 100%);
        box-shadow:
          0 0 0 2px #0a0c10,
          0 40px 90px rgba(0, 0, 0, 0.75),
          0 0 120px rgba(74, 158, 255, 0.07);
        transform-origin: center center;
      }

      /* 画面そのもの。iframe の角も一緒に丸める。 */
      .screen {
        position: relative;
        width: var(--screen-w);
        height: var(--screen-h);
        border-radius: calc(var(--radius) - var(--bezel));
        overflow: hidden;
        background: #080d16;
      }

      .screen iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }

      /* Dynamic Island。画面の上に重ねるだけで、アプリ側には干渉しない。 */
      .island {
        position: absolute;
        top: 11px;
        left: 50%;
        transform: translateX(-50%);
        width: 125px;
        height: 36px;
        border-radius: 20px;
        background: #000;
        pointer-events: none;
        z-index: 2;
      }

      /* ホームインジケータ */
      .home-bar {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 140px;
        height: 5px;
        border-radius: 3px;
        background: rgba(255, 255, 255, 0.5);
        pointer-events: none;
        z-index: 2;
      }

      /* 側面のボタン */
      .btn {
        position: absolute;
        background: linear-gradient(90deg, #23272e, #454b55);
        border-radius: 2px;
      }
      .btn-silent  { left: -3px; top: 120px; width: 3px; height: 30px; }
      .btn-up      { left: -3px; top: 178px; width: 3px; height: 58px; }
      .btn-down    { left: -3px; top: 250px; width: 3px; height: 58px; }
      .btn-power   { right: -3px; top: 205px; width: 3px; height: 92px; }

      /* 操作ヒント。H キーで消せる。 */
      .hint {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.28);
        font-size: 12px;
        letter-spacing: 0.04em;
        user-select: none;
      }
      .hint[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="phone" id="phone">
        <div class="btn btn-silent"></div>
        <div class="btn btn-up"></div>
        <div class="btn btn-down"></div>
        <div class="btn btn-power"></div>
        <div class="screen">
          <div class="island"></div>
          <iframe id="app" src="/" title="Apogee"></iframe>
          <div class="home-bar"></div>
        </div>
      </div>
    </div>

    <p class="hint" id="hint">F: 全画面 / R: 再読み込み / H: この表示を消す</p>

    <script>
      const phone = document.getElementById('phone')
      const hint = document.getElementById('hint')
      const app = document.getElementById('app')

      // ウインドウに収まる最大倍率で表示する。投影の解像度が低くても破綻しない。
      function fit() {
        const margin = 48
        const w = phone.offsetWidth
        const h = phone.offsetHeight
        const scale = Math.min(
          (window.innerWidth - margin) / w,
          (window.innerHeight - margin) / h,
        )
        phone.style.transform = `scale(${scale})`
      }

      window.addEventListener('resize', fit)
      fit()

      document.addEventListener('keydown', e => {
        const key = e.key.toLowerCase()
        if (key === 'f') {
          if (document.fullscreenElement) document.exitFullscreen()
          else document.documentElement.requestFullscreen?.()
        }
        if (key === 'r') app.contentWindow.location.reload()
        if (key === 'h') hint.hidden = !hint.hidden
      })
    </script>
  </body>
</html>
