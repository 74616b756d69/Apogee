# =====================
# アプリケーション設定
# =====================
spring.application.name=space-app
server.port=8080

# =====================
# MySQL 設定
# ※ password は環境に合わせて変更してください
# =====================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:spacedb}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# =====================
# JPA / Hibernate 設定
# =====================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# =====================
# Space Launch Now API
# 開発用（レート制限が緩い）: https://lldev.thespacedevs.com/2.2.0
# 本番用: https://ll.thespacedevs.com/2.2.0
# =====================
space.api.base-url=https://ll.thespacedevs.com/2.2.0

# =====================
# Apple Calendar (CalDAV) 設定
# アプリ専用パスワード発行: https://appleid.apple.com → セキュリティ → アプリ専用パスワード
# =====================
apple.calendar.username=${APPLE_CALENDAR_USERNAME:}
apple.calendar.password=${APPLE_CALENDAR_PASSWORD:}

# =====================
# ログ設定
# =====================
logging.level.com.space=INFO
