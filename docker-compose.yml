services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-your_password}
      MYSQL_DATABASE: ${DB_NAME:-spacedb}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-spacedb}
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-your_password}
      APPLE_CALENDAR_USERNAME: ${APPLE_CALENDAR_USERNAME:-}
      APPLE_CALENDAR_PASSWORD: ${APPLE_CALENDAR_PASSWORD:-}
      SPACE_API_BASE_URL: ${SPACE_API_BASE_URL:-https://ll.thespacedevs.com/2.2.0}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ALLOWED_EMAIL: ${ALLOWED_EMAIL:-akahori.t.24kdgn@gmail.com}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "0.0.0.0:8080:8080"
    volumes:
      - image_cache:/root/.space-app/images

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "0.0.0.0:3000:80"

volumes:
  db_data:
  image_cache:
